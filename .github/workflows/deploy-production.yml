name: Deploy Backend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    name: Backend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

  deploy:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/deploy_key

          echo "Testing SSH port reachability..."

          nc -vz \
            "${{ secrets.SERVER_HOST }}" \
            "${{ secrets.SERVER_PORT }}"

          echo "Adding server to known_hosts..."

          ssh-keyscan \
            -T 30 \
            -p "${{ secrets.SERVER_PORT }}" \
            -H "${{ secrets.SERVER_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Pull latest main and restart Docker Compose
        run: |
          ssh \
            -o BatchMode=yes \
            -i ~/.ssh/deploy_key \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" << 'REMOTE'
          set -euo pipefail

          cd /home/prod/Rms-Backend

          echo "Fetching latest main branch..."

          git fetch --prune origin \
            '+refs/heads/main:refs/remotes/origin/main'

          git reset --hard refs/remotes/origin/main

          echo "Building and restarting backend containers..."

          docker compose up -d --build

          echo "Removing unused Docker images..."

          docker image prune -f

          echo "Current container status:"

          docker compose ps
          REMOTE
