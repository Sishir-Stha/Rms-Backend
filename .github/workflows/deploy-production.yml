name: Deploy Backend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-check:
    name: Backend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

  deploy:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest
    needs: build-check

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Testing SSH port reachability..."
          nc -vz ${{ secrets.SERVER_HOST }} ${{ secrets.SERVER_PORT }}

          echo "Adding server to known_hosts..."
          ssh-keyscan -T 30 -p ${{ secrets.SERVER_PORT }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pull latest main and restart Docker Compose
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
              set -e
              
            cd /home/prod/Rms-Backend
            git fetch --prune origin \
                '+refs/heads/main:refs/remotes/origin/main'
            
            git reset --hard refs/remotes/origin/main
            
            docker compose up -d --build 
            docker image prune -f 
            docker compose ps
          "
